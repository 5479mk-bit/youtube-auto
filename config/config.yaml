video:
  width: 1080
  height: 1920
  fps: 30
  # ffmpeg 인코딩 속도. 러너가 2코어라 medium 은 한 편에 10분이 넘는다.
  preset: veryfast
  threads: 0            # 0 이면 코어 수만큼
  # 유튜브 쇼츠 UI 가 덮는 영역. 핵심 정보는 이 사이(safe band)에만 배치한다.
  safe_top: 0.25
  safe_bottom: 0.25
  part_duration_min: 30
  part_duration_max: 40
  cut_duration_min: 2.5
  cut_duration_max: 3.0
  hook_duration: 3.0
  zoom_amount: 0.08
  # 포스터형 레이아웃: 풀스크린 영상이 아니라 어두운 캔버스 위 액자 박스에 영상을 앉힌다.
  # top/bottom 은 화면 세로 비율(0~1), margin_x 는 좌우 여백 비율이다.
  frame_top: 0.22
  frame_bottom: 0.78
  frame_margin_x: 0.06
  frame_bg_color: "#0B0B10"
  frame_border_color: "#E8C97A"
  frame_border_width: 4
  frame_border_radius: 18
  frame_title_color: "#FFFFFF"

subtitle:
  # 외곽선을 버리고 드롭 섀도우로 바꿨다. 글자가 얇아진 만큼 크기도 줄인다.
  font_size: 52
  font_color: "#F2EFE8"
  emphasis_color: "#D9A441"   # 형광 노랑 대신 낡은 금박 톤
  shadow_blur: 6
  bottom_ratio: 0.24          # 자막 블록 아래끝을 화면 하단 24% 지점에
  max_chars_per_line: 16

audio:
  # supertonic(로컬 서버)이 항상 1순위로 시도된다(build_tts_engines 참고). 이 engine
  # 값은 supertonic 이 꺼져 있을 때 내려갈 다음 엔진을 고른다 — edge 는 무료라
  # 기본값으로 둔다.
  engine: edge
  supertonic_url: "http://127.0.0.1:5000/api/synthesize"
  supertonic_voice: default
  gemini_voice: Charon        # 차분하고 신뢰감 있는 남성 톤(다큐 내레이터에 맞음)
  gemini_model: gemini-2.5-flash-preview-tts
  gemini_style_prompt: "차분한 다큐멘터리 내레이터처럼, 진짜 사람이 말하듯 자연스러운 속도로"
  gemini_min_request_interval: 1.5
  edge_voice: injoon          # ko-KR-InJoonNeural (supertonic 실패 시 최종 폴백)
  edge_pitch: "-5Hz"
  # cloud_tts 는 기본 경로가 아니다 — 설정 한 줄(engine)로 되돌릴 수 있게 남겨둔다.
  cloud_tts_voice: ko-KR-Neural2-C
  cloud_tts_pitch: -1.5
  # 다크 앰비언트 드론을 전체에 깔고, 사건이 터지는 문장에 초저음 타격음을 얹는다.
  bgm_volume_db: -16
  bgm_hook_volume_db: -12
  sfx_volume_db: -6

script:
  llm:
    # vertex_gemini = 같은 모델을 GCP 크레딧으로. AI Studio 선불 잔액은 0 이다(402).
    provider: vertex_gemini
    model: gemini-3.6-flash
    temperature: 0.9
  # 부별 목표 글자 수. 한국어 내레이션 기준 대략 1초당 5~6자.
  part1_target_chars: 190
  part2_target_chars: 200

topics:
  # sillok(조선왕조실록) | heritage(국가유산청 해설문) | disaster(해외 자연재해·인재).
  # 25단계: 해외 재난 소재 + 3D 엔지니어링 단면도 연출로 전환.
  source: disaster
  disaster:
    # 손으로 고른 실제 사건 제목(위키백과 문서명). 전체 자동 발굴은 나중.
    # 대한민국 내 인재는 여기 절대 적지 않는다 — src/disasters/ 에 코드 레벨
    # 방어선도 따로 있다.
    titles:
      - 타이타닉호
      - 체르노빌 원자력 발전소 사고
      - 리스본 대지진
    weights:
      story_density: 0.5
      freshness: 0.5
  sillok:
    # 샘플 단계라 기사를 사람이 지목한다. 왕대 전체 색인은 샘플을 보고 판단한다.
    article_ids:
      - kob_10109025_003   # 1609년 강원도 기이한 자연현상 보고 (광해 1년 9월 25일)
      - kra_11201008_003   # 경신대기근: 예조판서 조복양의 구휼 상소, 죽음, 왕의 결단
                            # (현종 12년 1월 8일, 1671년) — 23단계, 자연재해 소재
    weights:
      event_score: 0.55     # 사관이 놀라서 적은 사건일수록 높다 (src/sillok/event_keywords.py)
      story_density: 0.25
      freshness: 0.20
  candidates_per_dataset: 12
  # 문화유산 야사 스코어 가중치. 축 설명은 src/heritage/story_scorer.py 참고.
  weights:
    story_density: 0.30
    mystery_score: 0.35
    prestige: 0.20
    freshness: 0.15

visuals:
  # 장면 생성 모델. 빈 값이면 기본값(gemini-2.5-flash-image).
  ai_image_model: ""
  allowed_licenses:
    - cc0
    - cc-by
    - cc-by-sa
    - public domain

publish:
  privacy_status: private
  category_id: "25"  # News & Politics
  default_tags:
    - 문화유산
    - 역사
    - 야사
    - 쇼츠

# 사진을 실제로 움직이는 영상으로 만드는 유료 경로. 8초 단위로 과금된다.
# 배치는 "사진 → 그 사진이 움직이는 Veo 컷 → 다음 사진" 교차식이라, 정지 사진만 훑는
# 지루함은 피하면서 비용은 클립 수만큼만 든다.
# 생성 과금 경로와 상한.
cloud:
  # vertex = GCP 크레딧(₩354,417)으로 결제. aistudio = AI Studio 선불 잔액.
  # 선불 잔액이 0 이라 vertex 로 간다.
  backend: vertex
  project_id: "vid115"  # 비우면 VERTEX_PROJECT_ID / GOOGLE_CLOUD_PROJECT 환경변수
  location: us-central1
  # Imagen 계열이 이 프로젝트의 Model Garden 카탈로그에 아예 없다(검색해도 안 뜬다).
  # Gemini 이미지 모델을 그대로 Vertex 로 부른다 — AI Studio 분기와 같은 generateContent
  # 형식이라 ai_image.py 가 모델 이름으로 자동으로 이 경로를 탄다.
  image_model: gemini-3.1-flash-image
  image_cost_krw: 30    # Imagen 4 fast 장당 약 0.02달러
  tts_cost_krw: 50      # 내레이션 한 부(40~50초) 추정
  # 크레딧을 다 쓰면 생성을 멈춘다. 여기 적힌 금액은 우리가 계산한 **추정치**이고,
  # 실제 청구는 GCP 만 안다 — 그래서 예비금을 남겨두고 그만큼은 아예 안 쓴다.
  credit_krw: 354417
  reserve_krw: 20000
  stop_when_exhausted: true

veo:
  tier: lite            # lite | fast | standard — 단가가 8배까지 벌어진다
  resolution: 720p
  duration_seconds: 8
  clips_per_part: 2     # 부당 Veo 클립 수. 0 이면 전부 무료 파랄랙스로 간다
  still_seconds: 6.0    # Veo 컷 사이에 사진을 몇 초 보여줄지
  # lite 8초 기준 클립당 약 590원. 편당 4클립이면 약 2,400원, 하루 1편이면 월 약 7만원.
  max_clips_per_episode: 4
  max_clips_per_day: 12

# 무료 경로. 깊이를 추정해 카메라가 장면 안으로 들어간다.
parallax:
  shift: 0.06   # 좌우/상하 이동 시 가까운 것과 먼 것의 최대 시차(화면 폭 대비)
  dolly: 0.12   # 전진/후퇴 시 깊이별 배율 차이

# Veo 클립과 파랄랙스 컷을 한 카메라로 찍은 것처럼 묶는 마감.
film_look:
  grain: 6.0
  vignette: 0.30
  exposure_breathing: 0.02
