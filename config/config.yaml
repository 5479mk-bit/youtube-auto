video:
  width: 1080
  height: 1920
  fps: 30
  # ffmpeg 인코딩 속도. 러너가 2코어라 medium 은 한 편에 10분이 넘는다.
  preset: veryfast
  threads: 0            # 0 이면 코어 수만큼
  # 유튜브 쇼츠 UI 가 덮는 영역. 핵심 정보는 이 사이(safe band)에만 배치한다.
  safe_top: 0.25
  safe_bottom: 0.25
  part_duration_min: 30
  part_duration_max: 40
  cut_duration_min: 2.5
  cut_duration_max: 3.0
  hook_duration: 3.0
  zoom_amount: 0.08
  # 포스터형 레이아웃: 풀스크린 영상이 아니라 어두운 캔버스 위 액자 박스에 영상을 앉힌다.
  # top/bottom 은 화면 세로 비율(0~1), margin_x 는 좌우 여백 비율이다.
  frame_top: 0.22
  frame_bottom: 0.78
  frame_margin_x: 0.06
  frame_bg_color: "#0B0B10"
  frame_border_color: "#E8C97A"
  frame_border_width: 4
  frame_border_radius: 18
  frame_title_color: "#FFFFFF"

subtitle:
  # 외곽선을 버리고 드롭 섀도우로 바꿨다. 글자가 얇아진 만큼 크기도 줄인다.
  font_size: 52
  font_color: "#F2EFE8"
  emphasis_color: "#D9A441"   # 형광 노랑 대신 낡은 금박 톤
  shadow_blur: 6
  bottom_ratio: 0.24          # 자막 블록 아래끝을 화면 하단 24% 지점에
  max_chars_per_line: 16

audio:
  # voxcpm(GPU 전용)과 supertonic(로컬 서버)이 항상 1·2순위로 시도된다
  # (build_tts_engines 참고). voxcpm 은 GitHub Actions 러너에 GPU가 없어 항상
  # 조용히 폴백된다. supertonic 은 CPU 로도 돌아가는 모델이라, shorts.yml 의
  # "Supertonic 서버 준비" 스텝이 `supertonic serve` 를 백그라운드로 띄워두면
  # 여기서 실제로 성공한다(무료라 cloud_tts 보다 비용이 안 든다).
  # 이 engine 값은 voxcpm/supertonic 이 둘 다 실패했을 때 그다음 엔진 순서를 고른다.
  # "cloud_tts"(Google Cloud TTS, Neural2)가 기본이다 — Gemini 의 멀티모달 오디오
  # 출력은 "다큐 성우" 톤을 내기엔 부족하다고 확인됐다(사용자 청취). Cloud TTS 는
  # SSML 로 피치를 직접 지시할 수 있는 전용 합성 엔진이라 더 깊고 무게감 있는
  # 톤을 낼 수 있다.
  engine: cloud_tts
  # 품질 엔진(voxcpm/supertonic/gemini/cloud_tts)이 전부 실패했을 때 edge-tts
  # (기계음)로 조용히 떨어지는 대신 렌더를 멈춘다(tts_engine.TTSFailure) — "저품질
  # 목소리로 끝까지 만들어놓고 나서야 실패를 안다"를 없애기 위함. 비용이 최우선이라
  # edge 라도 상관없을 때만 false 로 내린다.
  require_quality_voice: true
  # 실제 supertonic-py 서버 스펙(github.com/supertone-inc/supertonic-py) 기준.
  # 예전 값(127.0.0.1:5000/api/synthesize)은 실존하지 않는 엔드포인트였다 — 그래서
  # 항상 연결 거부로 폴백됐다.
  supertonic_url: "http://127.0.0.1:7788/v1/tts"
  supertonic_voice: M1   # 내장 보이스: M1~M5(남성)/F1~F5(여성). 실제 샘플 7개를
                          # 청취 비교해 M1 로 확정했다(사용자 청취 검증).
  supertonic_lang: ko
  # 합성 정밀도(diffusion steps, 1~100). 서버 기본값은 낮아 로보틱하게 들린다 —
  # steps=10/32/64/100 을 청취 비교해 64로 확정했다(사람 목소리에 가깝고, 문장당
  # 약 14초로 100(약 22초)보다 빠르다). 값을 낮추면 더 로보틱해지는 대신 빨라진다.
  supertonic_steps: 64
  # 서버가 긴 문장을 내부적으로 쪼개 합성하면 이음매에서 말이 끊기는 소리가 난다 —
  # VEO 문장(최대 약 100자)이 한 번에 통째로 합성되도록 넉넉히 잡는다.
  supertonic_max_chunk_length: 400
  gemini_voice: Charon        # 차분하고 신뢰감 있는 남성 톤(다큐 내레이터에 맞음)
  gemini_model: gemini-2.5-flash-preview-tts
  gemini_style_prompt: "차분한 다큐멘터리 내레이터처럼, 진짜 사람이 말하듯 자연스러운 속도로"
  gemini_min_request_interval: 1.5
  edge_voice: injoon          # ko-KR-InJoonNeural (require_quality_voice=false 일 때만 쓰임)
  edge_pitch: "-5Hz"
  cloud_tts_voice: ko-KR-Neural2-C   # 공식 문서 기준 남성 음성. 실제 톤은 직접 들어보고
                                     # 마음에 안 들면 이 이름만 바꾸면 된다(B/D 등).
  cloud_tts_pitch: -4.0   # 세미톤. -1.5는 거의 안 들려서 '신비한 건축사전' 급으로
                           # 더 낮췄다 — 너무 낮추면(-10 이하) 음성이 깨지므로 이 값이
                           # 안전 상한에 가깝다.
  # 다크 앰비언트 드론을 전체에 깔고, 사건이 터지는 문장에 초저음 타격음을 얹는다.
  bgm_volume_db: -16
  bgm_hook_volume_db: -12
  # -6dB는 드론·내레이션에 묻혀 "효과음이 거의 안 들린다"는 지적이 있었다 —
  # "쾅쾅 터지도록" 확실히 들리게 4dB 올렸다.
  sfx_volume_db: -4

script:
  llm:
    # vertex_gemini = 같은 모델을 GCP 크레딧으로. AI Studio 선불 잔액은 0 이다(402).
    provider: vertex_gemini
    model: gemini-3.6-flash
    temperature: 0.9
  # 부별 목표 글자 수. 한국어 내레이션 기준 대략 1초당 5~6자.
  part1_target_chars: 190
  part2_target_chars: 200

topics:
  # sillok(조선왕조실록) | heritage(국가유산청 해설문) | disaster(해외 자연재해·인재).
  # 25단계: 해외 재난 소재 + 3D 엔지니어링 단면도 연출로 전환.
  source: disaster
  disaster:
    # 손으로 고른 실제 사건 제목(위키백과 문서명). 전체 자동 발굴은 나중.
    # 대한민국 내 인재는 여기 절대 적지 않는다 — src/disasters/ 에 코드 레벨
    # 방어선도 따로 있다.
    titles:
      - 타이타닉호
      - 체르노빌 원자력 발전소 사고
      - 리스본 대지진
    weights:
      story_density: 0.5
      freshness: 0.5
  sillok:
    # 샘플 단계라 기사를 사람이 지목한다. 왕대 전체 색인은 샘플을 보고 판단한다.
    article_ids:
      - kob_10109025_003   # 1609년 강원도 기이한 자연현상 보고 (광해 1년 9월 25일)
      - kra_11201008_003   # 경신대기근: 예조판서 조복양의 구휼 상소, 죽음, 왕의 결단
                            # (현종 12년 1월 8일, 1671년) — 23단계, 자연재해 소재
    weights:
      event_score: 0.55     # 사관이 놀라서 적은 사건일수록 높다 (src/sillok/event_keywords.py)
      story_density: 0.25
      freshness: 0.20
  candidates_per_dataset: 12
  # 문화유산 야사 스코어 가중치. 축 설명은 src/heritage/story_scorer.py 참고.
  weights:
    story_density: 0.30
    mystery_score: 0.35
    prestige: 0.20
    freshness: 0.15

visuals:
  # 장면 생성 모델. 빈 값이면 기본값(gemini-2.5-flash-image).
  ai_image_model: ""
  allowed_licenses:
    - cc0
    - cc-by
    - cc-by-sa
    - public domain
  # 생성 정지화(AI_IMAGE)도 사진 컷과 똑같이 깊이 기반 파랄랙스(motion.parallax)로
  # 움직인다 — 색 보정을 아무리 만져도 "화면이 정지 사진처럼 보인다"는 문제는
  # 안 풀렸다. 평평한 줌(크롭+리사이즈)과 달리 픽셀마다 깊이가 달라 원근이 실제로
  # 어긋나며 지나간다. 재난 소재는 사진 기본값(parallax.shift 0.06/parallax.dolly
  # 0.12)보다 더 세게 민다.
  ai_image_motion:
    parallax_amount: 0.10   # 팬/시프트 시 최대 시차(화면 폭 대비)
    dolly_amount: 0.30       # 푸시인/풀아웃 시 깊이별 배율 차이

publish:
  privacy_status: private
  category_id: "25"  # News & Politics
  default_tags:
    - 문화유산
    - 역사
    - 야사
    - 쇼츠

# 사진을 실제로 움직이는 영상으로 만드는 유료 경로. 8초 단위로 과금된다.
# 배치는 "사진 → 그 사진이 움직이는 Veo 컷 → 다음 사진" 교차식이라, 정지 사진만 훑는
# 지루함은 피하면서 비용은 클립 수만큼만 든다.
# 생성 과금 경로와 상한.
cloud:
  # vertex = GCP 크레딧(₩354,417)으로 결제. aistudio = AI Studio 선불 잔액.
  # 선불 잔액이 0 이라 vertex 로 간다.
  backend: vertex
  project_id: "vid115"  # 비우면 VERTEX_PROJECT_ID / GOOGLE_CLOUD_PROJECT 환경변수
  location: us-central1
  # Imagen 계열이 이 프로젝트의 Model Garden 카탈로그에 아예 없다(검색해도 안 뜬다).
  # Gemini 이미지 모델을 그대로 Vertex 로 부른다 — AI Studio 분기와 같은 generateContent
  # 형식이라 ai_image.py 가 모델 이름으로 자동으로 이 경로를 탄다.
  image_model: gemini-3.1-flash-image
  image_cost_krw: 30    # Imagen 4 fast 장당 약 0.02달러
  tts_cost_krw: 50      # 내레이션 한 부(40~50초) 추정
  # 크레딧을 다 쓰면 생성을 멈춘다. 여기 적힌 금액은 우리가 계산한 **추정치**이고,
  # 실제 청구는 GCP 만 안다 — 그래서 예비금을 남겨두고 그만큼은 아예 안 쓴다.
  credit_krw: 354417
  reserve_krw: 20000
  stop_when_exhausted: true

veo:
  tier: lite            # lite | fast | standard — 단가가 8배까지 벌어진다
  resolution: 720p
  duration_seconds: 8
  clips_per_part: 2     # 부당 Veo 클립 수. 0 이면 전부 무료 파랄랙스로 간다
  still_seconds: 6.0    # Veo 컷 사이에 사진을 몇 초 보여줄지
  # VEO 로 지정된 문장의 최종(무음 패딩 포함) 최소 길이. scene_planner 가 씬 길이를
  # 문장 길이 그대로 물려받으므로, 대본 문장(15~20자, 약 3~4초)이 짧으면 Veo 가 실제로
  # 만든 duration_seconds(8초)짜리 영상도 그만큼만 잘려 화면 대부분이 정지 이미지처럼
  # 보인다("맨처음+중간 2번은 움직여야" 피드백의 원인). "실제로 8초를 만들었으면
  # 8초를 다 써야지 아깝게" — duration_seconds 와 같은 값으로 맞춰 생성된 영상을
  # 끝까지 쓴다(짧게 잡아 일부러 잘라내지 않는다).
  min_scene_seconds: 8
  # lite 8초 기준 클립당 약 590원. 편당 4클립이면 약 2,400원, 하루 1편이면 월 약 7만원.
  max_clips_per_episode: 4
  max_clips_per_day: 12

# 무료 경로. 깊이를 추정해 카메라가 장면 안으로 들어간다.
parallax:
  shift: 0.06   # 좌우/상하 이동 시 가까운 것과 먼 것의 최대 시차(화면 폭 대비)
  dolly: 0.12   # 전진/후퇴 시 깊이별 배율 차이

# 3D 엔지니어링 단면도 인포그래픽 스타일은 그레인·비네팅이 없는 깔끔한 렌더가 맞다
# (25단계). video_builder.py 의 기본값도 0 이지만, 여기 값이 우선 적용되므로 반드시
# 0 으로 맞춰둔다.
film_look:
  grain: 0
  vignette: 0
  exposure_breathing: 0
