video:
  width: 1080
  height: 1920
  fps: 30
  # 유튜브 쇼츠 UI 가 덮는 영역. 핵심 정보는 이 사이(safe band)에만 배치한다.
  safe_top: 0.25
  safe_bottom: 0.25
  part_duration_min: 30
  part_duration_max: 40
  cut_duration_min: 2.5
  cut_duration_max: 3.0
  hook_duration: 3.0
  zoom_amount: 0.08

subtitle:
  font_size: 64
  font_color: "#FFFFFF"
  emphasis_color: "#FFD84D"
  stroke_color: "#000000"
  stroke_width: 6
  max_chars_per_line: 16

audio:
  voice: ko-KR-InJoonNeural
  rate: "+8%"
  bgm_volume_db: -18
  bgm_hook_volume_db: -12

script:
  llm:
    provider: gemini
    model: gemini-2.0-flash
    temperature: 0.9
  # 부별 목표 글자 수. 한국어 내레이션 기준 대략 1초당 5~6자.
  part1_target_chars: 190
  part2_target_chars: 200

topics:
  datasets:
    - business
    - population
    - fire
    - traffic
    - realestate
  candidates_per_dataset: 12
  # 감정 훅 스코어 가중치
  weights:
    personal_relevance: 0.35
    surprise: 0.35
    magnitude: 0.20
    freshness: 0.10

visuals:
  allowed_licenses:
    - cc0
    - cc-by
    - cc-by-sa
    - public domain

publish:
  privacy_status: private
  category_id: "25"  # News & Politics
  default_tags:
    - 공공데이터
    - 데이터분석
    - 통계
    - 쇼츠

# 사진을 실제로 움직이는 영상으로 만드는 유료 경로. 8초 단위로 과금되므로 도입부에 몰아준다.
veo:
  tier: lite            # lite | fast | standard — 단가가 8배까지 벌어진다
  resolution: 720p
  duration_seconds: 8
  clips_per_part: 1     # 부당 Veo 클립 수. 0 이면 전부 무료 파랄랙스로 간다
  max_clips_per_episode: 2
  max_clips_per_day: 6

# 무료 경로. 깊이를 추정해 카메라가 장면 안으로 들어간다.
parallax:
  shift: 0.06   # 좌우/상하 이동 시 가까운 것과 먼 것의 최대 시차(화면 폭 대비)
  dolly: 0.12   # 전진/후퇴 시 깊이별 배율 차이

# Veo 클립과 파랄랙스 컷을 한 카메라로 찍은 것처럼 묶는 마감.
film_look:
  grain: 6.0
  vignette: 0.30
  exposure_breathing: 0.02
