video:
  width: 1080
  height: 1920
  fps: 30
  # ffmpeg 인코딩 속도. 러너가 2코어라 medium 은 한 편에 10분이 넘는다.
  preset: veryfast
  threads: 0            # 0 이면 코어 수만큼
  # 유튜브 쇼츠 UI 가 덮는 영역. 핵심 정보는 이 사이(safe band)에만 배치한다.
  safe_top: 0.25
  safe_bottom: 0.25
  part_duration_min: 30
  part_duration_max: 40
  # --combine-parts(1·2부를 나누지 않고 영상 하나로 합본)일 때의 목표 구간.
  # 사용자 지시: "최소 63초 이상". 상한은 사실상 없다 — 대본 3중 후킹 구조를
  # 그대로 이어 붙인 자연 길이(보통 70~90초)를 그대로 쓴다.
  # 사용자 지시(2026-09-27): 최소 63초, 90초를 넘기지 않는다.
  combined_duration_min: 63
  combined_duration_max: 90
  cut_duration_min: 2.5
  cut_duration_max: 3.0
  hook_duration: 3.0
  zoom_amount: 0.08
  # 포스터형 레이아웃: 풀스크린 영상이 아니라 어두운 캔버스 위 액자 박스에 영상을 앉힌다.
  # top/bottom 은 화면 세로 비율(0~1), margin_x 는 좌우 여백 비율이다.
  frame_top: 0.22
  frame_bottom: 0.78
  frame_margin_x: 0.06
  frame_bg_color: "#0B0B10"
  frame_border_color: "#E8C97A"
  frame_border_width: 4
  frame_border_radius: 18
  frame_title_color: "#FFFFFF"
  # 사용자 지시(2026-09-30): 틱톡/릴스 트렌드에 맞춘 kinetic typography — 숫자/단어
  # 오버레이가 뜰 때 팝인 애니메이션, sub_boom/crack/alarm/braam 컷 시작 순간
  # 화면이 짧게 흔들리는 카메라 셰이크. 과하면 언제든 false 로 끈다.
  kinetic_overlay: true
  camera_shake: true
  camera_shake_px: 10      # 흔들림 최대 진폭(픽셀)
  camera_shake_margin: 1.05  # 배경을 이만큼 오버사이즈해서 흔들려도 가장자리가 안 보이게

subtitle:
  # 외곽선을 버리고 드롭 섀도우로 바꿨다. 글자가 얇아진 만큼 크기도 줄인다.
  font_size: 46   # 레퍼런스처럼 작은 흰 글씨 한 줄
  font_color: "#FFFFFF"
  emphasis_color: "#FFFFFF"   # 레퍼런스처럼 강조색 없이 흰 글씨 하나로
  shadow_blur: 6
  bottom_ratio: 0.24          # 자막 블록 아래끝을 화면 하단 24% 지점에
  max_chars_per_line: 18
  dynamic_pop: true           # 자막 큐마다 짧게 튀어오르는 팝인 애니메이션(사용자 지시, 2026-10-01)

audio:
  # voxcpm(GPU 전용)과 supertonic(로컬 서버)이 항상 1·2순위로 시도된다
  # (build_tts_engines 참고). voxcpm 은 GitHub Actions 러너에 GPU가 없어 항상
  # 조용히 폴백된다. supertonic 은 CPU 로도 돌아가는 모델이라, shorts.yml 의
  # "Supertonic 서버 준비" 스텝이 `supertonic serve` 를 백그라운드로 띄워두면
  # 여기서 실제로 성공한다(무료라 cloud_tts 보다 비용이 안 든다).
  # 이 engine 값은 voxcpm/supertonic 이 둘 다 실패했을 때 그다음 엔진 순서를 고른다.
  # "cloud_tts"(Google Cloud TTS, Neural2)가 기본이다 — Gemini 의 멀티모달 오디오
  # 출력은 "다큐 성우" 톤을 내기엔 부족하다고 확인됐다(사용자 청취). Cloud TTS 는
  # SSML 로 피치를 직접 지시할 수 있는 전용 합성 엔진이라 더 깊고 무게감 있는
  # 톤을 낼 수 있다.
  # 샘플 12개(Gemini Pro/Flash, Chirp 3 HD) 청취 비교 끝에 Gemini 2.5 Pro TTS +
  # Charon + "친한 형이 실화 들려주듯" 톤으로 확정(사용자 선택). 이 값이 gemini 면
  # voxcpm/supertonic 은 체인에서 빠진다.
  engine: gemini
  # 품질 엔진(voxcpm/supertonic/gemini/cloud_tts)이 전부 실패했을 때 edge-tts
  # (기계음)로 조용히 떨어지는 대신 렌더를 멈춘다(tts_engine.TTSFailure) — "저품질
  # 목소리로 끝까지 만들어놓고 나서야 실패를 안다"를 없애기 위함. 비용이 최우선이라
  # edge 라도 상관없을 때만 false 로 내린다.
  require_quality_voice: true
  # 실제 supertonic-py 서버 스펙(github.com/supertone-inc/supertonic-py) 기준.
  # 예전 값(127.0.0.1:5000/api/synthesize)은 실존하지 않는 엔드포인트였다 — 그래서
  # 항상 연결 거부로 폴백됐다.
  supertonic_url: "http://127.0.0.1:7788/v1/tts"
  supertonic_voice: M1   # 내장 보이스: M1~M5(남성)/F1~F5(여성). 실제 샘플 7개를
                          # 청취 비교해 M1 로 확정했다(사용자 청취 검증).
  supertonic_lang: ko
  # 합성 정밀도(diffusion steps, 1~100). 서버 기본값은 낮아 로보틱하게 들린다 —
  # steps=10/32/64/100 을 청취 비교해 64로 확정했다(사람 목소리에 가깝고, 문장당
  # 약 14초로 100(약 22초)보다 빠르다). 값을 낮추면 더 로보틱해지는 대신 빨라진다.
  supertonic_steps: 64
  # 서버가 긴 문장을 내부적으로 쪼개 합성하면 이음매에서 말이 끊기는 소리가 난다 —
  # VEO 문장(최대 약 100자)이 한 번에 통째로 합성되도록 넉넉히 잡는다.
  supertonic_max_chunk_length: 400
  gemini_voice: Charon        # 차분하고 신뢰감 있는 남성 톤(다큐 내레이터에 맞음).
                              # Gemini TTS 는 다국어 모델이라 목소리는 그대로 두고
                              # 입력 텍스트만 스페인어면 스페인어로 읽는다.
  gemini_model: gemini-2.5-pro-preview-tts
  # 채널 언어를 스페인어로 전환(사용자 지시, 2026-09-30)하면서 스타일 지시문도
  # 스페인어 대본 기준으로 다시 썼다.
  gemini_style_prompt: "como un narrador confiable de documentales contando una historia real e interesante, en español neutro, siguiendo el guion tal cual, sin pausas largas entre frases, con un tono calmado que va subiendo la tensión poco a poco, sin sobreactuar, como una persona real"
  gemini_min_request_interval: 1.5
  edge_voice: es-MX-JorgeNeural   # 스페인어 남성 음성(require_quality_voice=false 일 때만 쓰임)
  edge_pitch: "-5Hz"
  cloud_tts_voice: ko-KR-Neural2-C   # 공식 문서 기준 남성 음성. 실제 톤은 직접 들어보고
                                     # 마음에 안 들면 이 이름만 바꾸면 된다(B/D 등).
  cloud_tts_pitch: -4.0   # 세미톤. -1.5는 거의 안 들려서 '신비한 건축사전' 급으로
                           # 더 낮췄다 — 너무 낮추면(-10 이하) 음성이 깨지므로 이 값이
                           # 안전 상한에 가깝다.
  # 다크 앰비언트 드론을 전체에 깔고, 사건이 터지는 문장에 초저음 타격음을 얹는다.
  # 사용자 지시(2026-09-30, "효과음 볼륨을 한국 콘텐츠보다 1.5배 이상"): sfx_volume_db
  # -6 → -2(약 +4dB, 진폭 기준 약 1.6배)로, 클라이맥스에서 배경음이 확 커지는
  # bgm_hook_volume_db 도 -9 → -6(+3dB)으로 같이 올렸다. 기본 배경음(bgm_volume_db)
  # 은 내레이션을 덮지 않도록 소폭만(-13 → -11) 올린다.
  bgm_volume_db: -11
  bgm_hook_volume_db: -6
  sfx_volume_db: -2
  # 효과음이 터지는 동안 배경음을 이만큼 더 낮춘다("더킹") — 시네마틱 믹싱 기본기
  # (사용자 지시, 2026-09-30). 배경음 자체 볼륨(bgm_volume_db)에 곱해서 적용된다.
  sfx_duck_db: -4

script:
  llm:
    # vertex_gemini = 같은 모델을 GCP 크레딧으로. AI Studio 선불 잔액은 0 이다(402).
    provider: vertex_gemini
    model: gemini-3.6-flash
    temperature: 0.9
  # 부별 목표 글자 수.
  # 채널 언어를 스페인어로 전환(2026-09-30)하면서 이 값도 다시 잡아야 했다 —
  # 90/95(한국어 기준, run #35 실측 0.458초/자)를 그대로 두니 스페인어 LLM 이
  # "문장 6~10개, 문장당 6~12단어"라는 구조 규칙(문장 수·길이 자체는 그대로 둬야
  # 자연스럽다)을 지키면서 글자 수 목표는 무시했다 — 스페인어는 같은 정보량에
  # 한국어보다 훨씬 많은 글자가 필요하기 때문이다(실측: 강제 후보로 뽑아본 결과
  # 1부 423자·2부 500자, 9문장씩). 이 값은 그 실측을 반영한 잠정치이고, 실제
  # 영상 길이는 이번 스페인어 TTS(초당 몇 자인지 아직 모른다)로 첫 실제 렌더를
  # 돌려봐야 정확히 안다 — 그 결과로 다시 조정할 것.
  part1_target_chars: 420
  part2_target_chars: 460

topics:
  # sillok(조선왕조실록) | heritage(국가유산청 해설문) | disaster(해외 자연재해·인재).
  # 25단계: 해외 재난 소재 + 3D 엔지니어링 단면도 연출로 전환.
  source: disaster
  disaster:
    # 손으로 고른 실제 사건 제목(위키백과 문서명). 전체 자동 발굴은 나중.
    # 대한민국 내 인재는 여기 절대 적지 않는다 — src/disasters/ 에 코드 레벨
    # 방어선도 따로 있다.
    # 3개뿐이던 목록을 늘렸다 — reuse_topic 기본값 버그(항상 켜져 있어 중복 방지
    # 이력이 무시됨)와 겹쳐 3일 내내 타이타닉만 나온 사고가 있었다(2026-09-29).
    # 이제 reuse_topic 기본은 꺼짐이라 매일 다른 주제가 순서대로 빠지는데, 목록이
    # 짧으면 며칠 안에 다시 바닥나므로 여유를 둔다.
    # 채널 언어를 스페인어로 전환(2026-09-30)했지만 이 제목들은 그대로 둔다 —
    # src/disasters/collect_candidates() 가 여전히 한국어 위키백과 본문을 "사실
    # 재료"로 가져오고(fetch_full_text 가 ko.wikipedia.org 고정), 대본 프롬프트
    # (GLOBAL_DISASTER_PROMPT, 스페인어판)가 그 본문을 정확히 번역해 스페인어로
    # 서술한다. 위키백과 API 호출 방식을 바꿀 필요가 없어 가장 안전한 경로다.
    titles:
      - 타이타닉호
      - 체르노빌 원자력 발전소 사고
      - 리스본 대지진
      - 후쿠시마 제1원자력 발전소 사고
      - 폼페이
      - 허리케인 카트리나
      - 2004년 인도양 지진해일
      - 1906년 샌프란시스코 지진
      - 라나 플라자 붕괴 사고
      - 2011년 동일본 대지진
      - 보팔 가스 누출 사고
      - 2010년 아이티 지진
      - 1976년 탕산 대지진
      - 1985년 멕시코시티 지진
      - 2005년 카슈미르 지진
      - 2008년 쓰촨 대지진
      - 1931년 중국 대홍수
      - 1970년 페루 지진
      - 1970년 볼라 사이클론
      - 퉁구스카 폭발사건
      - 간토 대지진
      - 챌린저 우주왕복선 폭발 사고
      - 컬럼비아 우주왕복선 공중분해 사고
      # 2026-10-09: 6일 연속(run #53~#58) 자동 스케줄이 "선정할 주제 후보가
      # 없습니다"로 중단됐다 — 16개가 전부 소진된 뒤 아무도 체크인을 못 봤다.
      # API로 실존을 확인한 7개를 추가해 23개로 늘렸다. 이 사고로 느낀 것:
      # 제목을 하나씩 추가하는 방식 자체가 매번 며칠 안에 또 바닥난다 —
      # history.mark_used() 를 "렌더 성공"이 아니라 "업로드 승인"에 걸든지,
      # 실록처럼 코퍼스 전체에서 자동 발굴하는 단계로 넘어가는 걸 다음에
      # 진지하게 검토할 것(지금은 당장의 운영 공백을 막는 미봉책이다).
      # 2026-10-02: 9개 목록이 사흘 만에(수동 테스트 렌더까지 겹쳐) 소진돼
      # "선정할 주제 후보가 없습니다"로 또 중단됐다(run #48) — API로 실존을
      # 확인한 3개를 더 추가했다(전부 15,000자 이상의 본문 확인됨).
      # 2026-10-03: 바로 다음날 또 소진돼 자동 스케줄(run #50)이 중단됐다 —
      # mark_used() 가 렌더 성공 시점(업로드 승인과 무관하게)에 바로 호출돼,
      # 디버깅용 수동 검증 렌더도 전부 큐를 갉아먹고 있었다. 당장은 4개를 더
      # 확인해서 추가했다(전부 본문 존재 확인됨) — 앞으로는 검증용 수동 실행에
      # reuse_topic:true 를 써서 운영 큐를 아끼기로 한다.
      # "타코마 내로스교"는 2026-10-01 run #45 에서 제거했다 — 한국어 위키백과에
      # 해당 문서가 아예 없어(missing) 본문을 못 가져와 후보가 0개로 떨어지고
      # 회차가 "선정할 주제 후보가 없습니다"로 중단됐다. 영어판에는 있지만
      # fetch_full_text 가 ko.wikipedia.org 고정이라(다국어 소스 혼용은 사실
      # 검증 원칙과 충돌) 이 제목으론 쓸 수 없다 — 추가하려면 한국어 문서가
      # 실제로 존재하는지 먼저 API로 확인할 것.
    # 2026-10-15: 손으로 적은 목록이 또 바닥나(run #66) 자동 발굴을 붙였다. 위 titles 를
    # 먼저 쓰고, 소진되면 이 분류 트리(위키백과 한국어판)를 따라 내려가 사건 문서를 모은다.
    # 없는 분류는 조용히 빈 결과로 넘어간다. 한국 관련 분류는 건너뛰고 본문 검사도 한다.
    discover:
      enabled: true
      max_depth: 2
      max_titles: 400
      per_run_candidates: 6   # 한 회차에 본문을 실제로 조회할 문서 수 상한(429 방지)
      roots:
        - 분류:지진
        - 분류:산업 재해
        - 분류:자연재해
        - 분류:항공기 사고
        - 분류:해난 사고
        - 분류:철도 사고
        - 분류:화산 폭발
        - 분류:태풍
        - 분류:홍수
        - 분류:원자력 사고
        - 분류:폭발 사고
        - 분류:건설 사고
        - 분류:광산 사고
        - 분류:기근
    weights:
      story_density: 0.5
      freshness: 0.5
  sillok:
    # 샘플 단계라 기사를 사람이 지목한다. 왕대 전체 색인은 샘플을 보고 판단한다.
    article_ids:
      - kob_10109025_003   # 1609년 강원도 기이한 자연현상 보고 (광해 1년 9월 25일)
      - kra_11201008_003   # 경신대기근: 예조판서 조복양의 구휼 상소, 죽음, 왕의 결단
                            # (현종 12년 1월 8일, 1671년) — 23단계, 자연재해 소재
    weights:
      event_score: 0.55     # 사관이 놀라서 적은 사건일수록 높다 (src/sillok/event_keywords.py)
      story_density: 0.25
      freshness: 0.20
  candidates_per_dataset: 12
  # 문화유산 야사 스코어 가중치. 축 설명은 src/heritage/story_scorer.py 참고.
  weights:
    story_density: 0.30
    mystery_score: 0.35
    prestige: 0.20
    freshness: 0.15

visuals:
  # 장면 생성 모델. 빈 값이면 기본값(gemini-2.5-flash-image).
  ai_image_model: ""
  allowed_licenses:
    - cc0
    - cc-by
    - cc-by-sa
    - public domain
  # 생성 정지화(AI_IMAGE)도 사진 컷과 똑같이 깊이 기반 파랄랙스(motion.parallax)로
  # 움직인다 — 색 보정을 아무리 만져도 "화면이 정지 사진처럼 보인다"는 문제는
  # 안 풀렸다. 평평한 줌(크롭+리사이즈)과 달리 픽셀마다 깊이가 달라 원근이 실제로
  # 어긋나며 지나간다. 재난 소재는 사진 기본값(parallax.shift 0.06/parallax.dolly
  # 0.12)보다 더 세게 민다.
  ai_image_motion:
    # 2026-10-19: "움직임이 너무 제한적" 피드백으로 약 2배로 키웠다.
    parallax_amount: 0.16   # 팬/시프트 시 최대 시차(화면 폭 대비)
    dolly_amount: 0.55       # 푸시인/풀아웃 시 깊이별 배율 차이

review:
  # 2026-10-16(사용자 지시): true 면 텔레그램 승인을 기다리지 않고 바로 업로드한다.
  # 텔레그램에는 "업로드 완료" 알림, 영상, 설명(해시태그 포함)만 보낸다. 제목은 1순위 후보.
  # false 로 되돌리면 예전처럼 제목 후보+승인 버튼을 보내고 승인 후에 올린다.
  auto_publish: true

publish:
  privacy_status: public   # 2026-10-19 사용자 지시: 자동 업로드를 바로 공개로
  category_id: "25"  # News & Politics
  # 업로드마다 자동으로 넣을 재생목록. 없으면 채널에 새로 만든다(사용자 지시).
  # 채널 언어를 스페인어로 전환(2026-09-30)하면서 재생목록 이름도 시청자에게
  # 보이는 텍스트라 스페인어로 바꿨다.
  playlist_title: Archivo de Desastres
  # 유튜브 videos.insert 의 snippet.defaultLanguage/defaultAudioLanguage 에 쓴다.
  # 스페인어권 시청자에게 더 정확히 노출/추천되도록 돕는다. 비우면(옛 한국어
  # 콘텐츠로 되돌릴 때) 아예 안 보낸다.
  default_language: es
  default_tags:
    - 문화유산
    - 역사
    - 야사
    - 쇼츠
  # 틱톡/인스타그램 자동 업로드 — 시크릿을 다 채우고 확인되면 true로 켠다
  # (사용자 지시, 2026-10-11). 둘 다 유튜브와 완전히 독립이라 하나가 꺼져 있거나
  # 실패해도 다른 쪽·유튜브 업로드에는 영향 없다.
  tiktok:
    enabled: true
    # 지금은 "초안함(Inbox) 업로드"를 쓴다 — 계정을 공개로 유지하고 싶어서
    # (사용자 지시, 2026-10-11) "다이렉트 포스트"(바로 게시)를 못 쓴다. 다이렉트
    # 포스트는 심사 전 앱이면 대상 계정이 비공개여야만 허용된다
    # (unaudited_client_can_only_post_to_private_accounts). privacy_level 은
    # 지금 코드에서 안 쓰이지만, 나중에 다이렉트 포스트로 되돌릴 때를 위해 남겨둔다.
    privacy_level: SELF_ONLY
  instagram:
    enabled: false

# 사진을 실제로 움직이는 영상으로 만드는 유료 경로. 8초 단위로 과금된다.
# 배치는 "사진 → 그 사진이 움직이는 Veo 컷 → 다음 사진" 교차식이라, 정지 사진만 훑는
# 지루함은 피하면서 비용은 클립 수만큼만 든다.
# 생성 과금 경로와 상한.
cloud:
  # vertex = GCP 크레딧(₩354,417)으로 결제. aistudio = AI Studio 선불 잔액.
  # 선불 잔액이 0 이라 vertex 로 간다.
  backend: vertex
  project_id: "vid115"  # 비우면 VERTEX_PROJECT_ID / GOOGLE_CLOUD_PROJECT 환경변수
  location: us-central1
  # Imagen 계열이 이 프로젝트의 Model Garden 카탈로그에 아예 없다(검색해도 안 뜬다).
  # Gemini 이미지 모델을 그대로 Vertex 로 부른다 — AI Studio 분기와 같은 generateContent
  # 형식이라 ai_image.py 가 모델 이름으로 자동으로 이 경로를 탄다.
  image_model: gemini-3.1-flash-image
  image_cost_krw: 30    # Imagen 4 fast 장당 약 0.02달러
  tts_cost_krw: 50      # 내레이션 한 부(40~50초) 추정
  # 크레딧을 다 쓰면 생성을 멈춘다. 여기 적힌 금액은 우리가 계산한 **추정치**이고,
  # 실제 청구는 GCP 만 안다 — 그래서 예비금을 남겨두고 그만큼은 아예 안 쓴다.
  credit_krw: 354417
  reserve_krw: 20000
  stop_when_exhausted: true

veo:
  # 2026-10-19: "그림 자체가 크게 움직여야" — 시작 이미지 없이 문장만으로 영상을 만든다.
  # 움직임은 훨씬 커지지만 디오라마 스타일 일관성은 프롬프트 문구에만 의존한다.
  text_to_video: true
  tier: lite            # lite | fast | standard — 단가가 8배까지 벌어진다
  # 1080p 는 Veo 3.1 에서 8초 클립만 지원해 4초 클립과 함께 쓸 수 없다(2026-10-19 검토).
  resolution: 720p
  # 레퍼런스는 컷 하나가 3~4초다. 8초 클립 하나 값으로 4초 클립 두 개를 만들어
  # 움직이는 컷 수를 두 배로 늘린다(Veo 는 초 단위 과금).
  duration_seconds: 4
  clips_per_part: 2     # 부당 Veo 클립 수. 0 이면 전부 무료 파랄랙스로 간다
  still_seconds: 6.0    # Veo 컷 사이에 사진을 몇 초 보여줄지
  # VEO 로 지정된 문장의 최종(무음 패딩 포함) 최소 길이. scene_planner 가 씬 길이를
  # 문장 길이 그대로 물려받으므로, 대본 문장(15~20자, 약 3~4초)이 짧으면 Veo 가 실제로
  # 만든 duration_seconds(8초)짜리 영상도 그만큼만 잘려 화면 대부분이 정지 이미지처럼
  # 보인다("맨처음+중간 2번은 움직여야" 피드백의 원인). "실제로 8초를 만들었으면
  # 8초를 다 써야지 아깝게" — duration_seconds 와 같은 값으로 맞춰 생성된 영상을
  # 끝까지 쓴다(짧게 잡아 일부러 잘라내지 않는다).
  min_scene_seconds: 4
  # lite 8초 기준 클립당 약 590원. 편당 4클립이면 약 2,400원, 하루 1편이면 월 약 7만원.
  # 부당 VEO 5~6문장(4초) × 2부.
  # 2026-10-19: 영상 비율을 높이며(부당 VEO 6문장 이상) 상한을 올렸다.
  max_clips_per_episode: 14
  max_clips_per_day: 28

# 무료 경로. 깊이를 추정해 카메라가 장면 안으로 들어간다.
parallax:
  shift: 0.06   # 좌우/상하 이동 시 가까운 것과 먼 것의 최대 시차(화면 폭 대비)
  dolly: 0.12   # 전진/후퇴 시 깊이별 배율 차이

# 3D 엔지니어링 단면도 인포그래픽 스타일은 그레인·비네팅이 없는 깔끔한 렌더가 맞다
# (25단계). video_builder.py 의 기본값도 0 이지만, 여기 값이 우선 적용되므로 반드시
# 0 으로 맞춰둔다.
film_look:
  grain: 0
  vignette: 0
  exposure_breathing: 0
