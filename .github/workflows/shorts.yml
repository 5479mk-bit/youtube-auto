name: 쇼츠 한 회차 만들기

# 로컬 PC 없이 돌리기 위한 실행 환경이다.
# - 자격증명은 GitHub Secrets 와 GCP Workload Identity 에만 있다(파일로 존재하지 않는다).
# - 이 러너는 이 프로젝트의 개발 샌드박스와 달리 외부 API 가 막히지 않는다.
on:
  workflow_dispatch:
    inputs:
      no_veo:
        description: "Veo 를 쓰지 않는다 (과금 없음)"
        type: boolean
        default: false
      reuse_topic:
        description: "이미 다룬 주제도 다시 고른다"
        type: boolean
        default: true
      review:
        description: "렌더 후 텔레그램으로 검수 요청을 보낸다"
        type: boolean
        default: true
  # 매일 돌리려면 아래 두 줄의 주석을 푼다 (UTC 기준 — 09:00 KST = 00:00 UTC).
  # schedule:
  #   - cron: "0 0 * * *"

# WIF(키 없는 인증)에 필요하다. id-token 이 없으면 GCP 가 GitHub 을 못 알아본다.
permissions:
  contents: read
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 생성물(Veo 클립·AI 이미지)과 실록 기사 캐시를 회차 사이에 물려준다.
      # 같은 프롬프트를 두 번 만들지 않으니 그만큼 과금이 줄고, 실록 사이트가 끊겨도
      # 이미 받아둔 기사로 돌아간다.
      - name: 생성물 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: shorts-cache-${{ github.run_id }}
          restore-keys: shorts-cache-

      # 폰트·지도·오디오는 매번 받으면 느리다. 내용이 고정이라 캐시로 충분하다.
      - name: 에셋 캐시 복원
        uses: actions/cache@v4
        with:
          path: assets
          key: shorts-assets-${{ hashFiles('download_assets.sh', 'tools/make_paper_texture.py') }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 에셋 준비
        run: ./download_assets.sh

      # 키 파일 없이 GCP 에 로그인한다. GitHub 이 OIDC 토큰으로 신원을 증명하고,
      # GCP 가 그 신원에 서비스 계정 권한을 빌려준다 — 저장되는 키가 없다.
      - name: GCP 인증 (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Vertex 점검 (과금 없음)
        env:
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
        run: python main.py cloud-check

      - name: 한 회차 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.no_veo }}" = "true" ]; then ARGS="$ARGS --no-veo"; fi
          if [ "${{ inputs.reuse_topic }}" != "false" ]; then ARGS="$ARGS --reuse-topic"; fi
          # 승인을 기다리며 러너를 몇십 분 켜두는 건 낭비다. 보내고 짧게만 기다린다.
          if [ "${{ inputs.review }}" != "false" ]; then ARGS="$ARGS --review --wait 90"; fi
          python main.py run $ARGS

      - name: 지출 현황
        if: always()
        run: python main.py credits

      - name: 영상 내려받기용으로 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/script.json
            output/**/*.srt
            logs/*.log
          retention-days: 14
          if-no-files-found: warn
