name: 쇼츠 한 회차 만들기

# 로컬 PC 없이 돌리기 위한 실행 환경이다.
# - 자격증명은 GitHub Secrets 와 GCP Workload Identity 에만 있다(파일로 존재하지 않는다).
# - 이 러너는 이 프로젝트의 개발 샌드박스와 달리 외부 API 가 막히지 않는다.
on:
  workflow_dispatch:
    inputs:
      no_veo:
        description: "Veo 를 쓰지 않는다 (과금 없음)"
        type: boolean
        default: false
      reuse_topic:
        description: "이미 다룬 주제도 다시 고른다"
        type: boolean
        default: true
      review:
        description: "렌더 후 텔레그램으로 검수 요청을 보낸다"
        type: boolean
        default: true
      part1_only:
        description: "1부만 렌더/전송한다 (검증 사이클용 — 만족하면 false 로 되돌릴 것).
          combine_parts 가 true 면 이 값은 무시된다."
        type: boolean
        default: true
      combine_parts:
        description: "1부·2부로 나누지 않고 영상 하나로 합본 렌더한다 (최소 63초,
          사용자 지시 2026-09-26). part1_only 보다 우선한다."
        type: boolean
        default: true
      image_only:
        description: "Vertex 점검(이미지 1장, 약 30원)까지만 하고 전체 렌더는 건너뛴다"
        type: boolean
        default: false
      preview_seconds:
        description: "컨셉만 싸게 확인할 때: 1부를 이 초수 안쪽으로 줄여서 렌더한다
          (컷 수가 줄어 과금도 그만큼 준다). 비워두면 평소처럼 전체 길이로 렌더한다.
          예: 10 을 넣고 no_veo 도 켜면 AI 이미지 1~2장 수준(약 30~60원)으로 끝난다."
        type: string
        default: ""
      review_wait_seconds:
        description: "텔레그램 승인을 기다리는 시간(초). 이 안에 승인하면 같은 실행에서
          바로 업로드까지 끝난다 — 못 받으면 review-pending 스케줄 워크플로가 나중에 잡는다."
        type: string
        default: "1200"
  # 하루 한 편, 자동으로 만든다(사용자 지시, 2026-09-27). combine_parts 가
  # workflow_dispatch 쪽 기본값(true)과 같은 자리에서 스케줄 실행도 그대로 물려받는다
  # (schedule 이벤트는 inputs 가 전부 비므로, ARGS 조립부의 `|| 기본값` 폴백이 그대로
  # "합본 1편, Veo 켜짐, 텔레그램 검수 요청"으로 떨어진다 — 아래 검증 1번 참고).
  # push 는 여전히 켜지 않는다 — 커밋마다 돈이 나가는 건 원한 적이 없다.
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00. 매일 한 번.

# WIF(키 없는 인증)에 필요하다. id-token 이 없으면 GCP 가 GitHub 을 못 알아본다.
permissions:
  contents: read
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    # 렌더(최대 ~20분/부) + 검수 대기(review_wait_seconds, 기본 20분)를 합치면
    # 60분을 넘길 수 있어 여유를 둔다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 생성물(Veo 클립·AI 이미지)과 실록 기사 캐시를 회차 사이에 물려준다.
      # 같은 프롬프트를 두 번 만들지 않으니 그만큼 과금이 줄고, 실록 사이트가 끊겨도
      # 이미 받아둔 기사로 돌아간다.
      - name: 생성물 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: shorts-cache-${{ github.run_id }}
          restore-keys: shorts-cache-

      # 폰트·지도·오디오는 매번 받으면 느리다. 내용이 고정이라 캐시로 충분하다.
      - name: 에셋 캐시 복원
        uses: actions/cache@v4
        with:
          path: assets
          key: shorts-assets-${{ hashFiles('download_assets.sh', 'tools/make_paper_texture.py') }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 에셋 준비
        run: ./download_assets.sh

      # 시크릿을 이름마다 하나씩 넣는 건 손이 많이 간다. DOTENV 시크릿 하나에
      # `이름=값` 을 줄줄이 넣어두면 여기서 .env 로 풀어 쓴다 — 파이프라인이 이미
      # python-dotenv 로 .env 를 읽으므로 그다음은 평소와 같다.
      #
      # 주의: GitHub 은 시크릿 "통째"만 로그에서 가려준다. 줄 단위로 쪼갠 값은 안 가려주니
      # 여기서 직접 마스킹을 걸어준다.
      - name: DOTENV 시크릿 풀기
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          # step 의 `if:` 에서는 secrets 를 못 읽는다(표현식 오류로 워크플로 전체가
          # 파싱조차 안 된다). 비었는지는 여기서 본다.
          if [ -z "$DOTENV" ]; then
            echo "DOTENV 시크릿이 없습니다 — 개별 시크릿을 씁니다"
            exit 0
          fi
          printf '%s\n' "$DOTENV" > .env
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            name="${line%%=*}"
            value="${line#*=}"
            [ -z "$value" ] && continue
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < .env
          echo "DOTENV 에서 $(grep -c '=' .env) 개의 값을 읽었습니다."

      # "Secrets and variables" 페이지에는 탭이 둘이다 — Secrets 와 Variables.
      # Variables 탭에 넣은 값은 secrets.* 로는 안 잡히고 vars.* 로만 잡히는데, 화면이
      # 거의 같아서 헷갈리기 쉽다. 어느 쪽에 들어갔는지 여기서 짚어준다(값은 안 찍는다).
      - name: 시크릿 점검
        id: preflight
        env:
          S_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          V_WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          S_SA: ${{ secrets.GCP_SERVICE_ACCOUNT || env.GCP_SERVICE_ACCOUNT }}
          V_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
          S_PROJECT: ${{ secrets.VERTEX_PROJECT_ID || env.VERTEX_PROJECT_ID }}
          V_PROJECT: ${{ vars.VERTEX_PROJECT_ID }}
          S_GEMINI: ${{ secrets.GEMINI_API_KEY || env.GEMINI_API_KEY }}
          V_GEMINI: ${{ vars.GEMINI_API_KEY }}
          S_TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || env.TELEGRAM_BOT_TOKEN }}
          S_TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID || env.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          in_vars=""
          for name in WIF SA PROJECT GEMINI; do
            secret="S_$name"; variable="V_$name"
            if [ -n "${!secret}" ]; then
              echo "  $name: Secrets 탭에서 찾음"
            elif [ -n "${!variable}" ]; then
              echo "  $name: ⚠ Variables 탭에 있음"
              in_vars="$in_vars $name"
            else
              missing="$missing $name"
            fi
          done

          if [ -n "$in_vars" ]; then
            echo "::warning::Variables 탭에 들어간 값:$in_vars"
            echo "  → GCP 식별자 3개(WIF/SA/PROJECT)는 비밀이 아니라 Variables 여도 동작한다."
            echo "  → 다만 GEMINI_API_KEY 는 반드시 Secrets 여야 한다. Variables 는 로그와"
            echo "    화면에 그대로 보이기 때문이다. 거기 있다면 지우고 Secrets 에 다시 넣으세요."
          fi

          # GCP 값이 없어도 회차는 만들 수 있다 — 생성 컷만 대체 화면으로 내려갈 뿐이다.
          # 그래서 여기서 멈추는 건 대본을 못 쓰는 경우(GEMINI)뿐이다.
          case " $missing " in
            *" WIF "*|*" SA "*|*" PROJECT "*)
              echo "::warning::GCP 설정이 없어 이번 회차는 AI 생성 컷을 대체 화면으로 만듭니다"
              echo "  (Cloud Shell 로 WIF 를 만든 뒤 DOTENV 에 두 줄 추가하면 켜집니다)"
              ;;
          esac
          if [ -n "$S_WIF" ] && [ -n "$S_SA" ]; then
            echo "has_gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp=false" >> "$GITHUB_OUTPUT"
          fi

          case " $missing " in *" GEMINI "*)
            echo "::error::대본을 쓸 수 없습니다 — GEMINI_API_KEY 가 없습니다"
            echo ""
            echo "넣는 방법은 둘 중 하나입니다."
            echo " (가) 한 번에: 이름이 DOTENV 인 시크릿 하나를 만들고 값에 아래처럼 줄줄이"
            echo "     GEMINI_API_KEY=..."
            echo "     TELEGRAM_BOT_TOKEN=..."
            echo "     TELEGRAM_CHAT_ID=..."
            echo "     VERTEX_PROJECT_ID=vid115"
            echo " (나) 하나씩: 위 이름 그대로 시크릿을 하나씩 추가"
            echo "저장소 Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
            ;;
          esac

          if [ -z "$S_TG_TOKEN" ] || [ -z "$S_TG_CHAT" ]; then
            echo "::warning::텔레그램 시크릿이 비어 있어 검수 전송은 건너뜁니다"
          fi
          echo "필요한 값이 모두 있습니다."

      # 키 파일 없이 GCP 에 로그인한다. GitHub 이 OIDC 토큰으로 신원을 증명하고,
      # GCP 가 그 신원에 서비스 계정 권한을 빌려준다 — 저장되는 키가 없다.
      - name: GCP 인증 (Workload Identity)
        id: auth
        if: steps.preflight.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER || env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT || env.GCP_SERVICE_ACCOUNT }}

      # 여기서 대본 모델과 이미지 모델을 실제로 한 번씩 부른다(약 30원). 지난 회차는
      # 이 확인이 없어서 22분을 렌더한 뒤에야 "대본도 그림도 전부 폴백이었다"를 알았다.
      - name: Vertex 점검 (실제 생성, 약 30원)
        if: steps.preflight.outputs.has_gcp == 'true'
        env:
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID || vars.VERTEX_PROJECT_ID || env.VERTEX_PROJECT_ID }}
        run: python main.py cloud-check --generate

      # 승인 대기 중 GitHub 이 끊기거나(타임아웃) 사람이 늦게 눌러도, 다음 실행이나
      # review-pending 스케줄 워크플로가 이어받을 수 있게 검수 상태(state.sqlite3)와
      # 렌더 산출물(output/)을 이 저장소 캐시에 남긴다. 러너는 실행마다 새로 뜨는
      # 빈 컨테이너라 이게 없으면 "나중에 다시 확인" 자체가 불가능하다.
      - name: 검수 대기 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            output
            state.sqlite3
          key: shorts-pending-review-nonexistent-${{ github.run_id }}
          restore-keys: shorts-pending-review-

      # YouTube 업로드는 OAuth 로 한다(서비스 계정이 아니라 실제 채널 계정 동의가
      # 필요하다) — client_secret.json 과 최초 1회 로컬 로그인으로 받은 token.json 을
      # 시크릿에서 풀어 settings.py 가 기대하는 기본 경로에 그대로 둔다.
      # (발급 방법: tools/get_youtube_token.py)
      - name: YouTube 인증 파일 준비
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$CLIENT_SECRET" ]; then
            printf '%s' "$CLIENT_SECRET" > credentials/youtube_client_secret.json
          fi
          if [ -n "$TOKEN_JSON" ]; then
            printf '%s' "$TOKEN_JSON" > credentials/youtube_token.json
          fi
          if [ -z "$CLIENT_SECRET" ] || [ -z "$TOKEN_JSON" ]; then
            echo "::warning::YouTube 인증 시크릿이 비어 있습니다 — 승인해도 업로드는 건너뜁니다"
          fi
          # 값이 있으면 실제로 JSON 으로 파싱되고 필요한 키가 있는지만 확인한다(내용은 찍지 않는다).
          python - <<'PY'
          import json, pathlib
          for name, path, required_keys in [
              ("client_secret", "credentials/youtube_client_secret.json", ["installed", "web"]),
              ("token", "credentials/youtube_token.json", ["refresh_token"]),
          ]:
              p = pathlib.Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  print(f"[{name}] 파일이 비어있거나 없습니다 ({path})")
                  continue
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:
                  print(f"[{name}] JSON 파싱 실패: {exc}")
                  continue
              if name == "client_secret":
                  ok = any(k in data for k in required_keys)
              else:
                  ok = "refresh_token" in data
              print(f"[{name}] JSON 파싱 성공, {p.stat().st_size}바이트, 필요한 키 있음={ok}")
          PY

      # Supertonic 은 로컬 HTTP 서버로 뜨는 CPU 전용 TTS 다(GPU 불필요, voxcpm 과
      # 다름) — 패키지가 제공하는 CLI 로 이 러너 위에서 직접 띄운다. 첫 실행은 모델을
      # 받아오느라(약 400MB) 느릴 수 있어 넉넉히 기다린다. 서버가 안 뜨거나 시간 안에
      # 준비되지 않으면 경고만 남기고 넘어간다 — 파이프라인은 다음 엔진(cloud_tts)으로
      # 자연스럽게 폴백된다(TTSEngine 계약).
      - name: Supertonic 서버 준비
        if: inputs.image_only != true
        run: |
          pip install 'supertonic[serve]'
          nohup supertonic serve --host 127.0.0.1 --port 7788 \
            > supertonic-server.log 2>&1 &
          echo "Supertonic 서버 기동 대기 중…"
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7788/v1/styles > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" = true ]; then
            echo "Supertonic 서버 준비 완료"
          else
            echo "::warning::Supertonic 서버가 5분 안에 준비되지 않았습니다 — cloud_tts 로 폴백됩니다"
            tail -n 50 supertonic-server.log || true
          fi

      - name: 한 회차 생성
        if: inputs.image_only != true
        env:
          # 개별 시크릿이 있으면 그걸 쓰고, 없으면 DOTENV 에서 풀린 값이 그대로 남는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || env.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP || env.GEMINI_API_KEY_BACKUP }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY || env.DATA_GO_KR_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || env.TELEGRAM_CHAT_ID }}
          VERTEX_PROJECT_ID: ${{ secrets.VERTEX_PROJECT_ID || vars.VERTEX_PROJECT_ID || env.VERTEX_PROJECT_ID }}
        run: |
          # inputs.* 는 workflow_dispatch 에서만 채워진다. push/schedule 처럼 다른
          # 이벤트로 실행되면 전부 빈 문자열이 되는데, 대부분의 bash 비교는 그래도
          # 안전한 기본값 쪽으로 떨어진다 — 단 review_wait_seconds 만은 "--wait" 뒤에
          # 아무 값도 안 남아 argparse 가 즉시 실패하므로 명시적 기본값이 꼭 필요하다.
          ARGS=""
          if [ "${{ inputs.no_veo || 'false' }}" = "true" ]; then ARGS="$ARGS --no-veo"; fi
          if [ "${{ inputs.reuse_topic }}" != "false" ]; then ARGS="$ARGS --reuse-topic"; fi
          if [ "${{ inputs.combine_parts }}" != "false" ]; then
            ARGS="$ARGS --combine-parts"
          elif [ "${{ inputs.part1_only }}" != "false" ]; then
            ARGS="$ARGS --part1-only"
          fi
          # 컨셉만 싸게 확인할 때: 1부를 이 초수 안쪽으로 줄여서 컷 수(=과금)를 그만큼 줄인다.
          if [ -n "${{ inputs.preview_seconds }}" ]; then
            ARGS="$ARGS --preview-seconds ${{ inputs.preview_seconds }}"
          fi
          # 여기서 승인이 오면 같은 실행 안에서 바로 업로드까지 끝난다. 못 받으면
          # review-pending 스케줄 워크플로가 캐시에 남은 state.sqlite3/output 으로 잡는다.
          if [ "${{ inputs.review }}" != "false" ]; then
            ARGS="$ARGS --review --wait ${{ inputs.review_wait_seconds || '1200' }}"
          fi
          python main.py run $ARGS

      - name: 지출 현황
        if: always()
        run: python main.py credits

      - name: 검수 대기 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output
            state.sqlite3
          key: shorts-pending-review-${{ github.run_id }}

      - name: 영상 내려받기용으로 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/script.json
            output/**/*.srt
            output/sample_images/*
            logs/*.log
          retention-days: 14
          if-no-files-found: warn
