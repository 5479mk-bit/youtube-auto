name: 대기 중인 승인 확인

# 쇼츠 한 회차 만들기(shorts.yml)가 텔레그램 승인을 review_wait_seconds 안에 못 받고
# 끝나면, 그 회차는 state.sqlite3 에 "대기 중"으로 남고 렌더 산출물은 캐시에 남는다.
# 이 워크플로가 주기적으로 깨서 그 캐시를 복원하고 `review-pending` 으로 승인 여부를
# 다시 확인한다 — 사람이 뒤늦게 버튼을 눌러도 업로드까지 자동으로 이어지게 하는 자리다.
#
# 승인/거절 자체는 텔레그램에서 바로 일어나지만(콜백은 즉시 응답), "그 결과를 읽어서
# 유튜브에 올리는" 동작은 이 프로세스가 떠 있어야만 일어난다 — 그래서 폴링이 필요하다.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"   # 15분마다. 텔레그램 승인 후 최대 15분 안에는 업로드된다.

permissions:
  contents: read
  # 인스타그램 업로드가 GCS 공개 버킷에 접근하려면(WIF, 키 없는 인증) 필요하다.
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # shorts.yml 이 남겨둔 검수 대기 상태(state.sqlite3)와 렌더된 mp4(output/)를
      # 그대로 이어받는다. 없으면(대기 중인 회차가 없으면) 그냥 빈 채로 시작하고,
      # main.py 가 "대기 중인 승인이 없습니다"로 조용히 끝낸다.
      - name: 검수 대기 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            output
            state.sqlite3
          key: shorts-pending-review-nonexistent-${{ github.run_id }}
          restore-keys: shorts-pending-review-

      # 틱톡/인스타그램 회전 토큰(.cache/platform_tokens.json)이 여기 들어있다.
      # shorts.yml 이 쓰는 것과 같은 캐시 키라 서로 최신값을 주고받는다.
      - name: 회전 토큰 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: shorts-cache-nonexistent-${{ github.run_id }}
          restore-keys: shorts-cache-

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DOTENV 시크릿 풀기
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "DOTENV 시크릿이 없습니다 — 개별 시크릿을 씁니다"
            exit 0
          fi
          printf '%s\n' "$DOTENV" > .env
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            name="${line%%=*}"
            value="${line#*=}"
            [ -z "$value" ] && continue
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < .env

      - name: YouTube 인증 파일 준비
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          [ -n "$CLIENT_SECRET" ] && printf '%s' "$CLIENT_SECRET" > credentials/youtube_client_secret.json
          [ -n "$TOKEN_JSON" ] && printf '%s' "$TOKEN_JSON" > credentials/youtube_token.json
          if [ -z "$CLIENT_SECRET" ] || [ -z "$TOKEN_JSON" ]; then
            echo "::warning::YouTube 인증 시크릿이 비어 있습니다 — 승인해도 업로드는 건너뜁니다"
          fi
          true
          # 값이 있으면 실제로 JSON 으로 파싱되고 필요한 키가 있는지만 확인한다(내용은 찍지 않는다).
          python - <<'PY'
          import json, pathlib
          for name, path, required_keys in [
              ("client_secret", "credentials/youtube_client_secret.json", ["installed", "web"]),
              ("token", "credentials/youtube_token.json", ["refresh_token"]),
          ]:
              p = pathlib.Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  print(f"[{name}] 파일이 비어있거나 없습니다 ({path})")
                  continue
              try:
                  data = json.loads(p.read_text())
              except Exception as exc:
                  print(f"[{name}] JSON 파싱 실패: {exc}")
                  continue
              if name == "client_secret":
                  ok = any(k in data for k in required_keys)
              else:
                  ok = "refresh_token" in data
              print(f"[{name}] JSON 파싱 성공, {p.stat().st_size}바이트, 필요한 키 있음={ok}")
          PY

      # 인스타그램 업로드(GCS 공개 버킷에 임시 업로드)에 필요하다 — 틱톡/유튜브는
      # 이 인증 없이도 동작하므로, WIF 값이 없으면 그냥 건너뛴다(has_gcp 체크 없이
      # 바로 시도하고 실패하면 로그만 남긴다 — shorts.yml 처럼 사전 점검 스텝을
      # 따로 두지 않는 건, 이 워크플로는 15분마다 돌아 실패해도 비용 손실이 없다).
      - name: GCP 인증 (Workload Identity)
        id: auth
        # step 레벨 if 는 secrets 컨텍스트를 못 읽는다(DOTENV 때 겪은 것과 같은
        # 제약) — 조건 없이 항상 시도하고, 시크릿이 비어 있으면 continue-on-error
        # 가 실패를 삼켜서 다음 스텝(유튜브/틱톡 업로드)은 영향받지 않는다.
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: 대기 중인 승인 확인 및 업로드
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || env.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY || env.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET || env.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_SEED: ${{ secrets.TIKTOK_REFRESH_TOKEN_SEED || env.TIKTOK_REFRESH_TOKEN_SEED }}
          META_APP_ID: ${{ secrets.META_APP_ID || env.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET || env.META_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || env.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID || env.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GCS_PUBLIC_BUCKET: ${{ secrets.GCS_PUBLIC_BUCKET || env.GCS_PUBLIC_BUCKET }}
        run: python main.py review-pending --wait 30

      # 승인 처리 결과(state.sqlite3 갱신, 업로드된 회차의 output/ 은 더는 필요
      # 없지만 지우지 않는다 — 다음 실행이 또 지웠다 새로 받을 이유가 없다)를 다시
      # 캐시에 남긴다. shorts.yml 의 저장 스텝과 같은 패턴이다.
      - name: 검수 대기 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output
            state.sqlite3
          key: shorts-pending-review-${{ github.run_id }}

      - name: 회전 토큰 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: shorts-cache-${{ github.run_id }}
